<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema di smistamento e monitoraggio interventi" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iGestione Rep" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- PWA Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/img/icons/icon-512x512.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>iGestione Rep 2026 - Sistema di Monitoraggio Interventi</title>
  </head>
  <body>
    <noscript>
      <strong>Attenzione: questa applicazione richiede JavaScript abilitato per funzionare correttamente.</strong>
    </noscript>
    <div id="app"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then((registration) => {
              console.log('✅ Service Worker registrato:', registration);
              // Verifica aggiornamenti ogni ora
              setInterval(() => registration.update(), 3600000);
            })
            .catch((error) => {
              console.error('❌ Service Worker registration fallito:', error);
            });
        });
      }
    </script>
  </body>
</html>
